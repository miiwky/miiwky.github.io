<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สุ่มที่นั่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Prompt', sans-serif;
  background: #f5f5f7;
  color: #1d1d1f;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 16px;
}

h1 {
  font-size: 1.8rem;
  font-weight: 600;
  margin-bottom: 6px;
}

.subtitle {
  font-size: 0.9rem;
  color: #6e6e73;
  margin-bottom: 30px;
}

.panel {
  background: white;
  border-radius: 18px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
  margin-bottom: 30px;
}

.input-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 15px;
}

input:focus {
  outline: none;
  border-color: #0071e3;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: 600;
}

.btn-add {
  background: #0071e3;
  color: white;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  background: #f2f2f2;
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 0.9rem;
}

.status {
  margin-bottom: 20px;
  color: #6e6e73;
}

.car {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  width: 100%;
  max-width: 420px;
}

.seat {
  background: white;
  border-radius: 16px;
  padding: 20px 10px;
  text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.06);
  transition: 0.25s cubic-bezier(0.22,1,0.36,1);
}

.seat.shuffling {
  animation: shake 0.12s infinite;
}

@keyframes shake {
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-2px,1px)}
  75%{transform:translate(2px,-1px)}
}

.seat.highlight {
  background: #0071e3;
  color: white;
  transform: scale(1.05);
}

.seat.assigned {
  background: #34c759;
  color: white;
}

.seat:hover {
  transform: translateY(-4px);
}

.seat-name {
  font-weight: 600;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

.btn-primary {
  background: #0071e3;
  color: white;
}

.btn-secondary {
  background: #e5e5ea;
}

.result {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  text-align: center;
  transition: 0.3s;
}

.result.show {
  transform: translate(-50%, -50%) scale(1);
}

</style>
</head>

<body>

<h1>สุ่มที่นั่ง</h1>
<p class="subtitle">เพิ่มชื่อแล้วกดสุ่ม</p>

<div class="panel">
  <div class="input-bar">
    <input id="nameInput" placeholder="พิมพ์ชื่อ">
    <button class="btn-add" onclick="addName()">เพิ่ม</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="status" id="status">เพิ่มชื่อก่อน</div>

<div class="car" id="seats"></div>

<div class="controls">
  <button class="btn-primary" onclick="shuffle()">สุ่ม</button>
  <button class="btn-secondary" onclick="reset()">รีเซ็ต</button>
</div>

<div class="result" id="result">
  <h2>เสร็จแล้ว</h2>
  <p>จัดที่นั่งเรียบร้อย</p>
</div>

<script>
let names = [];
const max = 6;

const seatsEl = document.getElementById('seats');

for (let i = 0; i < max; i++) {
  const s = document.createElement('div');
  s.className = 'seat';
  s.innerHTML = '<div class="seat-name">ว่าง</div>';
  seatsEl.appendChild(s);
}

function render() {
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  names.forEach(n => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = n;
    chips.appendChild(c);
  });
}

function addName() {
  const input = document.getElementById('nameInput');
  const val = input.value.trim();
  if (!val || names.length >= max) return;
  names.push(val);
  input.value = '';
  render();
}

function shuffleArray(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

async function shuffle() {
  const seats = document.querySelectorAll('.seat');
  const shuffled = shuffleArray(names);

  seats.forEach(s => {
    s.classList.remove('assigned','highlight');
    s.classList.add('shuffling');
  });

  for (let i = 0; i < 15; i++) {
    seats.forEach(s => {
      s.querySelector('.seat-name').textContent = names[Math.floor(Math.random()*names.length)] || '?';
    });
    await new Promise(r => setTimeout(r, 80 + i*10));
  }

  seats.forEach(s => s.classList.remove('shuffling'));

  for (let i = 0; i < seats.length; i++) {
    const s = seats[i];
    s.classList.add('highlight');

    await new Promise(r => setTimeout(r, 200));

    s.querySelector('.seat-name').textContent = shuffled[i] || 'ว่าง';
    s.classList.remove('highlight');
    s.classList.add('assigned');
  }

  document.getElementById('result').classList.add('show');
  setTimeout(() => {
    document.getElementById('result').classList.remove('show');
  }, 1500);
}

function reset() {
  document.querySelectorAll('.seat').forEach(s => {
    s.classList.remove('assigned','highlight');
    s.querySelector('.seat-name').textContent = 'ว่าง';
  });
}
</script>

</body>
</html>
